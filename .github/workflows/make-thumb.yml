name: Auto 3x3 Thumbnail from GDrive

on:
  workflow_dispatch:
    inputs:
      gdrive_url:
        description: "Google Drive video share URL"
        required: true
        type: string
      thumb_name:
        description: "Output filename without extension"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate-collage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install FFmpeg, gdown & Pillow
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg curl
          pip install -q gdown pillow

      - name: Download video & generate 3x3 collage
        env:
          GDRIVE_URL: ${{ inputs.gdrive_url }}
          THUMB_NAME: ${{ inputs.thumb_name }}
        run: |
          python3 - << 'EOF'
          import os, re, subprocess
          from PIL import Image, ImageOps

          url = os.environ["GDRIVE_URL"].strip()
          name = re.sub(r"[^a-zA-Z0-9_-]", "_", os.environ["THUMB_NAME"].strip()) or "thumb"

          m = re.search(r"/d/([a-zA-Z0-9_-]+)|[?&]id=([a-zA-Z0-9_-]+)", url)
          file_id = (m.group(1) or m.group(2)) if m else None
          if not file_id:
              raise RuntimeError("Invalid Google Drive URL: no file ID found.")

          video_file = "input_video.mp4"
          subprocess.run(["gdown", f"https://drive.google.com/uc?id={file_id}", "-O", video_file])

          if not os.path.exists(video_file) or os.path.getsize(video_file) < 50000:
              if os.path.exists(video_file):
                  os.remove(video_file)
              subprocess.run([
                  "curl", "-L", "-sS",
                  f"https://drive.google.com/uc?export=download&confirm=t&id={file_id}",
                  "-o", video_file
              ], check=True)

          if not os.path.exists(video_file) or os.path.getsize(video_file) < 50000:
              raise RuntimeError("Could not download video from Drive. Make sure file sharing is 'Anyone with the link'.")

          probe = subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1", video_file
          ]).decode().strip()
          duration = float(probe)

          start_t = max(0.5, duration * 0.08)
          end_t = max(start_t + 1.0, duration * 0.92)
          step = (end_t - start_t) / 8.0

          os.makedirs("frames", exist_ok=True)
          tiles = []
          for i in range(9):
              ts = start_t + i * step
              f_path = f"frames/f_{i}.jpg"
              subprocess.run([
                  "ffmpeg", "-y", "-ss", f"{ts:.2f}", "-i", video_file,
                  "-frames:v", "1", "-q:v", "3", f_path
              ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
              img = Image.open(f_path).convert("RGB")
              fitted = ImageOps.fit(img, (320, 180), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
              tiles.append(fitted)

          collage = Image.new("RGB", (960, 540), (0, 0, 0))
          for idx, tile in enumerate(tiles):
              collage.paste(tile, ((idx % 3) * 320, (idx // 3) * 180))

          os.makedirs("thumbs", exist_ok=True)
          out_path = f"thumbs/{name}.jpg"
          collage.save(out_path, "JPEG", quality=85, optimize=True)
          print("Generated:", out_path)
          EOF

      - name: Commit and push thumbnail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thumbs/
          git diff --staged --quiet || (git commit -m "Add 3x3 thumbnail ${{ inputs.thumb_name }}" && git push)
