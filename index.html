<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Videos</title>
<style>
  :root { --bg:#fff; --fg:#111; --card:#f3f3f3; --muted:#666; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --card:#1c1c1c; --muted:#999; }
  }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
  input { width:100%; max-width:400px; padding:8px 12px; margin-bottom:16px; border-radius:8px; border:1px solid var(--muted); background:var(--card); color:var(--fg); }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  a { color:inherit; text-decoration:none; background:var(--card); border-radius:10px; overflow:hidden; display:block; }
  img { width:100%; display:block; }
  p { margin:8px 10px 12px; font-size:14px; word-break:break-word; }
  #count { color:var(--muted); font-size:14px; margin-bottom:12px; }
</style>
</head>
<body>
<input id="q" placeholder="Search...">
<div id="count"></div>
<div id="grid"></div>
<script>
let all = [];
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function render(list){
  document.getElementById("count").textContent = list.length + " videos";
  document.getElementById("grid").innerHTML = list.map(v =>
    `<a href="${encodeURI(v.link)}" target="_blank"><img src="${v.thumb}" loading="lazy" alt=""><p>${esc(v.name)}</p></a>`
  ).join("");
}
fetch("videos.json").then(r => r.json()).then(d => { all = d; render(all); });
document.getElementById("q").addEventListener("input", e => {
  const t = e.target.value.toLowerCase();
  render(all.filter(v => v.name.toLowerCase().includes(t)));
});
</script>
</body>
</html>
